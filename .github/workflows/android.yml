name: Musteri Takip APK Derleme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sistem Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip patch lld autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake ccache

      - name: Buildozer Kur ve Virtualenv Python 3.10 Sabitle
        run: |
          PY310="${{ steps.setup-python.outputs.python-path }}"
          "$PY310" -m pip install --upgrade "pip<25.0" setuptools wheel "virtualenv<20.27"
          "$PY310" -m pip install "cython<3.0" buildozer
          echo '#!/bin/bash' | sudo tee /usr/local/bin/virtualenv > /dev/null
          echo "exec \"$PY310\" -m virtualenv -p \"$PY310\" \"\$@\"" | sudo tee -a /usr/local/bin/virtualenv > /dev/null
          sudo chmod +x /usr/local/bin/virtualenv
          rm -rf .buildozer

      - name: APK Derle
        run: |
          yes | buildozer android debug > build.log 2>&1 || {
            echo "=== DERLEME HATASI DETAYI ==="
            grep -B 20 -A 2 "Command failed:" build.log || tail -n 50 build.log
            exit 1
          }

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: musteri-takip-apk
          path: bin/*.apk
