name: Musteri Takip APK Derleme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sistem Bağımlılıklarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip patch lld autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake ccache

      - name: Buildozer ve Uyumlu Pip/Cython Kur
        run: |
          python -m pip install --upgrade "pip<25.0" setuptools wheel "virtualenv<20.27"
          pip install "cython<3.0" https://github.com

      - name: APK Derle
        env:
          VIRTUALENV_PYTHON: /opt/hostedtoolcache/Python/3.10.22/x64/bin/python
          VIRTUALENV_PIP: "24.3.1"
        run: |
          yes | buildozer android debug > build.log 2>&1 || {
            echo "=== DERLEME HATASI DETAYI ==="
            grep -B 20 -A 2 "Command failed:" build.log || tail -n 50 build.log
            exit 1
          }

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: musteri-takip-apk
          path: bin/*.apk
