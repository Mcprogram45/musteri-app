name: Android APK

on:
  workflow_dispatch:   # elle çalıştırma

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derleme araçlarını kur
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf             libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev             libtinfo5 cmake libffi-dev libssl-dev

      - name: APK oluştur (ilk çalıştırma 30-60 dk sürebilir)
        run: buildozer android debug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: musteri-app-apk
          path: bin/*.apk
